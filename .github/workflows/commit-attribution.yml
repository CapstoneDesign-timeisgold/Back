name: Commit attribution

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

jobs:
  check:
    name: Check commit attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check all commits reachable from the candidate
        run: |
          python3 - <<'PY'
          import re
          import subprocess

          blocked_message = re.compile("(?im)^[ \\t]*co-authored-by:[ \\t]*(claude([ \\t]+(sonnet|opus|haiku|code)\\b|(\\[bot\\])?[ \\t]*<)|[^\\r\\n]*<[^>\\r\\n]+@anthropic\\.com[ \\t]*>|[^\\r\\n]*<([0-9]+\\+)?claude(-code)?(\\[bot\\])?@users\\.noreply\\.github\\.com[ \\t]*>)".encode())
          blocked_email = re.compile("(?i)(@anthropic\\.com$|^([0-9]+\\+)?claude(-code)?(\\[bot\\])?@users\\.noreply\\.github\\.com$)".encode())
          records = subprocess.check_output(
              ["git", "log", "-z", "--format=%H%x00%ae%x00%ce%x00%B", "HEAD"]
          ).split(b"\0")

          blocked = []
          for index in range(0, len(records) - 1, 4):
              commit, author, committer, message = records[index:index + 4]
              if blocked_message.search(message) or blocked_email.search(author) or blocked_email.search(committer):
                  blocked.append(commit[:12].decode())

          if blocked:
              raise SystemExit("Remove Claude attribution from commits: " + ", ".join(blocked))
          PY
