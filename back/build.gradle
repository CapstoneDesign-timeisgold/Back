plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'jiki'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'com.fasterxml.jackson.core:jackson-core:2.16.1'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'
	
	// JWT 관련 의존성 추가
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
}

tasks.named('test') {
	useJUnitPlatform { excludeTags 'performance', 'settlement-experiment' }
}

tasks.register('settlementExperiment', Test) {
	group = 'verification'
	description = 'Opt-in isolated MariaDB settlement integrity/concurrency and k6 retry experiment.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'settlement-experiment' }
	maxParallelForks = 1
	systemProperty 'settlement.label', providers.gradleProperty('settlementLabel').getOrElse('manual')
	systemProperty 'settlement.output', layout.projectDirectory.dir('docs/settlement-experiment/results').asFile.absolutePath
	outputs.upToDateWhen { false }
	testLogging { events 'passed', 'failed'; showStandardStreams = true }
}

tasks.register('performanceTest', Test) {
	description = 'Runs isolated MariaDB SQL and HTTP benchmarks (requires PERF_DB_* environment variables).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'performance' }
	maxParallelForks = 1
	systemProperty 'perf.label', providers.gradleProperty('perfLabel').getOrElse('manual')
	systemProperty 'perf.seconds', providers.gradleProperty('perfSeconds').getOrElse('10')
	systemProperty 'perf.output', layout.projectDirectory.dir('docs/performance/results').asFile.absolutePath
	outputs.upToDateWhen { false }
	testLogging { events 'passed', 'failed'; showStandardStreams = true }
}
