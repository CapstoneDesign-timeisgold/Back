# Include this file inside the installed Nginx http context (conf.d on EC2).
# Replace server_name with the actual API hostname before deployment.
server {
    listen 80;
    server_name api.example.com;
    server_tokens off;
    include /etc/nginx/snippets/jiki-proxy.conf;
}

# Flutter Web build files; the mobile app connects to the API host above.
server {
    listen 80;
    server_name web.example.com;
    server_tokens off;
    root /srv/jiki/flutter-web;
    index index.html;

    # Missing assets must return 404, not the SPA entry point.
    location ~* \.(?:js|mjs|css|wasm|json|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|map)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
