# Local entry point: nginx -p <this-directory>/ -c nginx.conf
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    log_format proxy '$remote_addr [$time_local] "$request_method $uri" '
                     '$status upstream=$upstream_status '
                     'request_time=$request_time upstream_time=$upstream_response_time';
    access_log logs/access.log proxy;
    server_tokens off;
    client_body_temp_path logs/client_body_temp;
    proxy_temp_path logs/proxy_temp;
    fastcgi_temp_path logs/fastcgi_temp;
    uwsgi_temp_path logs/uwsgi_temp;
    scgi_temp_path logs/scgi_temp;

    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        include proxy.conf;
    }
}
