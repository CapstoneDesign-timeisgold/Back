# Shared by the local server and the EC2 HTTP server.
client_max_body_size 1m;

location / {
    # No URI suffix: preserve the original API path and query string.
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # This Nginx instance is the external edge; discard client-supplied values.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_cache off;
    # Do not replay state-changing requests automatically.
    proxy_next_upstream off;
}
